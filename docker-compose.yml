services:
  # MySQL Database
  db:
    image: mysql:8.0
    container_name: asset-lifecycle-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-password}
      MYSQL_DATABASE: ${DB_NAME:-asset_lifecycle_db}
      MYSQL_USER: ${DB_USER:-asset_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-password}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/prisma/migrations:/docker-entrypoint-initdb.d
    networks:
      - asset-lifecycle-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD:-password}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: asset-lifecycle-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${PORT:-5000}
      DATABASE_URL: mysql://${DB_USER:-asset_user}:${DB_PASSWORD:-password}@db:3306/${DB_NAME:-asset_lifecycle_db}
      JWT_SECRET: ${JWT_SECRET:-your_super_secret_key_here_change_in_production}
    ports:
      - "${PORT:-5000}:5000"
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/prisma:/app/prisma
    networks:
      - asset-lifecycle-network
    command: sh -c "node dist/index.js"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:5000/api/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Optional: Only set VITE_API_URL if you need custom API URL
        # By default, frontend auto-detects API URL from browser location
        VITE_API_URL: ${VITE_API_URL:-}
    container_name: asset-lifecycle-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"
    networks:
      - asset-lifecycle-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  mysql_data:
    driver: local

networks:
  asset-lifecycle-network:
    driver: bridge
